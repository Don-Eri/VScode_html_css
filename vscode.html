<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styling/main.css">
    <title>vs code Layout</title>
</head>


<body>
    <header>

      <!--Header Section-->
<div class="nav-icons">
      <!--Visual Studio logo-->
    <img src="/icons/visual-studio-code-seeklogo.png" width="20" height="20" alt="vs code logo">

<!--Navigation bar-->

    <nav>
        <ul>
            <li>File</li>
            <li>Edit</li>
            <li>Selection</li>
            <li>View</li>
            <li>Go</li>
            <li>...</li>  

        </ul>


    </nav>

</div>

<div class="arrow-searchbar-spacing">
<!--The arrow icons left side of the search bar-->
<div class="arrow-icons">
    <img src="/icons/left icon.svg" width="20" height="20" alt="left arrow">
    <img src="/icons/right icon.svg" width="20" height="20" alt="right arrow">


</div>
<div class="search-custom-icons-spacing">
<!--Search bar itself-->
<div class="searchbar">
    <input type="text" placeholder="vs_code_layout">

    
    <!--Icons inside the search bar-->
    <div class="search-actions">
        <span><img src="/icons/vertical line.svg" alt="vertical line" width="15" height="15" ></span>
        <span> <img src="/icons/message icon.svg" alt="toggle chat button" width="15" height="15" ></span>
        <span><img src='/icons/chevron down icon.svg' alt='chevron down icon' width="15" height="15"></span>
      </div>  

        
</div>
<!--Icons beside the search bar-->
<div class="custom-minimize-icon-spacing">
        <div class="custom-icons">
            <ul>
            <li><button><span>Update</span></button></li>
            <li><img src="/icons/customize layout.svg" alt="customize layout" width="20" height="20"></li>
            <li><img src="/icons/toggle sidebar.svg" alt="side bar button" width="20" height="20"></li>
            <li><img src="/icons/toggle panel.svg" alt="panel button" width="20" height="20"></li>
            <li><img src="/icons/toggle secondary side bar.svg" alt="secondary sidebar" width="20" height="20"></li>
           
            </ul>


        </div>
        <div class="minimize-icons">
            <ul>
            <li><img src='/icons/minimize icon.svg' alt="minimize icon" width="15" height="15"></li>
            <li><img src='/icons/maximize icon.svg' alt="maximize icon" width="15" height="15"></li>
            <li><img src='/icons/close icon.svg' alt="close icon" width="15" height="15"></li>
               </ul>



        </div>
    
        
    </div>
    </div>
    </div>
    
</div>







</div>
</div>

    </header>


    <main></main>
    <aside>

        <!--Icons at the upper aside section--> 
        <div class="aside-icons">
    <ul>
        <li><img src="/icons/aside icons/file icon.svg" alt="file icon" width="25" height="25" ></li>
        <li><img src="/icons/aside icons/search icon.svg" alt="search icon" width="25" height="25" ></li>
        <li><img src="/icons/aside icons/source control icon.svg" alt="source control icon" width="25" height="25"></li>
        <li><img src="/icons/aside icons/run and debug icon.svg" alt=" run and debug icon" width="25" height="25"></li>
        <li><img src="/icons/aside icons/extensions icon.svg" alt="extensions icon" width="25" height="25"></li>
    </ul>
<!--Icons at the lower aside section-->
    <div class="lower-aside-icons">
        <ul>
            <li><img src="/icons/aside icons/github logo.svg" alt="github profile logo" width="25" height="25"></li>
            <li><img src="icons/aside icons/settings icon.svg" alt='settings icon' width="25" height="25"></li>
        </ul>

    </div>
    </div>
    </aside>
    <footer>
        <!--Texts and Icons in the footer section-->
        <div class="footer-icon-spacing">

             <div class="footer-left-icons">
                <ul>
                    <li><img src="icons/footer icons/open remote icon.svg" width="20" height="20" alt="remote icon"></li>
                    <li><img src="icons/footer icons/source control icon.svg" width="20" height="20" alt="source control icon"><span>main</span></li>
                    <li><img src="/icons/footer icons/launchpad.svg" width="20" height="20" alt="rocket icon"><img src="/icons/footer icons/debug disconnect.svg" width="20" height="20" alt="debug disconnect icon"><span>Launchpad</span> </li>
                    <li><img src="/icons/footer icons/error.svg" width="20" height="20" alt="error badge"><span>0</span><img src="/icons/footer icons/warning.svg" width="20" height="20" alt="warning icon"><span>0</span></li>
                    <li><img src="/icons/footer icons/lightning icon.svg" width="20" height="20" alt=" lightning icon"></li>


                </ul>


        </div>
        <div class="footer-right-icons">
            <ul>
          <li><img src="/icons/footer icons/git commit icon.svg" width="20" height='20' alt="git commit icon"><span>Not Committed Yet</span></li>      
        <li><span>Ln 129,Col 25</span></li>
       <li><span>Spaces:4</span></li>
        <li><span>UTF-8</span></li>
        <li><span>CRLF</span></li>
        <li><span>{} HTML</span></li>
        <li><img src="/icons/footer icons/circle slash.svg" width="20" height="20" alt="circle slash"><span>Port: 5501</span></li>
        <li><img src="/icons/footer icons/double tick.svg" width="25" height="25" alt="double tick icon"><span>Prettier</span></li>
        <li><img src="/icons/footer icons/notifications icon.svg" width="25" height="25" alt="notification bell"></li>
        </ul>
        </div>

       
        </div>


    </footer>



</body>
</html>
